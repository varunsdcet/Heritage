# Production stack for MyHeritage
# Run from repo root (/opt/myheritage):
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.production up -d --build
# Optional nginx on :80:
#   docker compose -f deploy/docker-compose.prod.yml --profile with-nginx --env-file .env.production up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heritage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-HeritagePg!2026}
      POSTGRES_DB: ${POSTGRES_DB:-heritage}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heritage -d heritage"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-heritage}:${POSTGRES_PASSWORD:-HeritagePg!2026}@postgres:5432/${POSTGRES_DB:-heritage}
      API_PORT: "4000"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://46.202.163.202}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "4000"
    ports:
      - "4000:4000"
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/__api}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:4000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/__api}
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:4000}
      GOOGLE_TTS_API_KEY: ${GOOGLE_TTS_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      SELFPACED_STRIPE_DEMO: ${SELFPACED_STRIPE_DEMO:-0}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      HEYGEN_API_KEY: ${HEYGEN_API_KEY:-}
      HEYGEN_VOICE_ID: ${HEYGEN_VOICE_ID:-}
      HEYGEN_MALE_VOICE_ID: ${HEYGEN_MALE_VOICE_ID:-}
    depends_on:
      - api
    expose:
      - "3000"
    ports:
      - "3000:3000"
    networks: [internal]

  workers:
    build:
      context: .
      dockerfile: deploy/Dockerfile.workers
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-heritage}:${POSTGRES_PASSWORD:-HeritagePg!2026}@postgres:5432/${POSTGRES_DB:-heritage}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    profiles: ["with-nginx"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - web
      - api
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
